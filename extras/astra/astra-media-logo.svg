<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Astra Media logo. Original artwork for the Astra Media fork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AA7FF"/>
      <stop offset="0.5" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E6FF"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>
  <!-- four-point star -->
  <path d="M256 92 C 268 196, 316 244, 420 256 C 316 268, 268 316, 256 420 C 244 316, 196 268, 92 256 C 196 244, 244 196, 256 92 Z" fill="url(#star)"/>
  <!-- play mark inside the star -->
  <path d="M238 222 L 292 256 L 238 290 Z" fill="#5E5CE6" stroke="#5E5CE6" stroke-width="10" stroke-linejoin="round"/>
  <!-- small sparkle -->
  <path d="M378 118 C 381 140, 390 149, 412 152 C 390 155, 381 164, 378 186 C 375 164, 366 155, 344 152 C 366 149, 375 140, 378 118 Z" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
